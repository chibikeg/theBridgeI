<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The Bridge Initiative</title>
  <desc id="desc">A community themed graphic featuring abstract bridge shapes and people silhouettes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#102b3a"/>
      <stop offset="100%" stop-color="#1d4755"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" x2="1">
      <stop offset="0%" stop-color="#d7e66b"/>
      <stop offset="100%" stop-color="#a8c642"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="200" fill="#1e5768" opacity="0.35"/>
  <circle cx="180" cy="540" r="260" fill="#d7e66b" opacity="0.12"/>

  <g fill="none" stroke="#d7e66b" stroke-width="10" stroke-linecap="square" opacity="0.95">
    <path d="M150 470V220h130v250M510 470V220h130v250M790 470V220h130v250"/>
    <path d="M280 300h230M280 370h230M920 300h110M920 370h110"/>
